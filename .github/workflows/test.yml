name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run core regression tests
        run: node tests/core.test.cjs

      - name: Run scenario validation tests
        run: node tests/scenario.test.cjs

      - name: Run sidebar layout contract test
        run: node tests/layout.test.cjs

      - name: Run Chrome/Chromium DOM smoke test
        run: python3 tests/browser-smoke.py

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/quantica-q-mark-white.png">
<title>Kalkulator kosztów AI – API, chmura, własny serwer</title>
<style>
/* ============================================================
   qweb – Quantica Lab website design system (workszop/q223)
   Tokens first; every component below is styled from them.
   ============================================================ */
@import url("https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap");

:root {
  /* ─── Brand ─── */
  --quantica-pink:    #d20757;
  --rose-pink:        #d20757;
  --deep-berry:       #8A004C;
  --magenta-tint:     #FFE6F1;
  --violet-primary:   #7030A0;
  --violet-deep:      #4F1F75;
  --ink:              #0A1F2C;
  --mist:             #F4EEFA;
  --near-black:       #111111;
  --white:            #FFFFFF;

  /* ─── Neutrals ─── */
  --fg-1:             #111111;
  --fg-2:             #111111;
  --fg-3:             #4B5563;
  --bg-1:             #FFFFFF;
  --bg-2:             #F5F6F8;
  --border-1:         #E6E8EC;
  --border-2:         #D1D5DB;

  /* ─── Type ─── */
  --font-display:     "Satoshi", system-ui, -apple-system, sans-serif;
  --font-sans:        "Satoshi", system-ui, -apple-system, sans-serif;
  --font-mono:        "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* ─── Shape & depth ─── */
  --radius-sm:        6px;
  --radius-md:        10px;
  --radius-lg:        16px;
  --radius-card:      18px;
  --radius-pill:      999px;
  --shadow-pink-soft: 0 6px 18px rgba(210, 7, 87, 0.10);
  --shadow-card:      0 10px 30px -12px rgba(10, 20, 40, 0.12);
  --shadow-lg:        0 24px 60px -20px rgba(10, 20, 40, 0.28);

  /* ─── Layout ─── */
  --nav-h: 64px;
  --content-w: 1120px;
  --sidebar-width: 330px;

  /* ─── Translucent surfaces (the only rgba() outside canvas/SVG) ─── */
  --nav-bg:           rgba(255, 255, 255, 0.88);
  --dialog-backdrop:  rgba(10, 31, 44, 0.55);
  --pink-tint-03:     rgba(210, 7, 87, 0.03);
  --pink-tint-05:     rgba(210, 7, 87, 0.05);
  --pink-tint-45:     rgba(210, 7, 87, 0.45);
  --white-92:         rgba(255, 255, 255, 0.92);
  --white-16:         rgba(255, 255, 255, 0.16);
  --focus-ring:       0 0 0 3px rgba(210, 7, 87, 0.28);

  /* ─── Chart series (cost paths) ─── */
  --chart-api:   var(--ink);
  --chart-cloud: var(--violet-primary);
  --chart-own:   var(--fg-3);
  --chart-small: var(--quantica-pink);
  --chart-tick-size: 11px;
  --chart-label-size: 12px;
  --chart-tick-align: end;
  --chart-x-align: middle;

  /* ─── Component type scale ─── */
  --tag-size: 11px;
  --label-size: 11px;
  --small-size: 12.5px;
  --tiny-size: 12px;
  --body-sm: 14px;
  --body: 15px;
  --body-lg: 17px;
  --h4: 18px;
  --h3: 22px;
  --title-size: clamp(1.9rem, 3vw, 2.6rem);
  --stat-size: 20px;
  --total-size: 34px;
  --disclosure-size: 15px;
  --line-height-body: 1.6;
  --line-height-note: 1.5;
  --line-height-tight: 1.45;
  --align-start: left;
  --align-center: center;
  --align-end: right;

  /* ─── Spacing (4pt) ─── */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
}

/* ─── Base ─── */
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body { margin: 0; padding: 0; height: 100dvh; overflow: hidden; font-family: var(--font-sans); color: var(--fg-2); background: var(--bg-1); line-height: var(--line-height-body); }
a { color: var(--quantica-pink); }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { width: 18px; height: 18px; stroke-width: 2; flex: none; }

/* ─── Nav (fixed blur bar) ─── */
.nav { position: sticky; top: 0; z-index: 50; width: 100%; height: var(--nav-h); background: var(--nav-bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-1); }
.nav-inner { height: 100%; padding: 0 28px; display: flex; align-items: center; gap: var(--sp-3); }
.nav-logo img { height: 30px; width: auto; display: block; }
.nav-tag { font-family: var(--font-mono); font-weight: 500; font-size: var(--tag-size); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); padding-left: var(--sp-3); border-left: 1px solid var(--border-1); }
.header-spacer { flex: 1; }

/* ─── Layout ─── */
main { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); height: calc(100dvh - var(--nav-h)); }
section { margin-bottom: var(--sp-8); }
.sec-title { font-family: var(--font-display); font-weight: 700; font-size: var(--h3); letter-spacing: -.02em; line-height: 1.1; color: var(--fg-1); margin: 0 0 var(--sp-4); }
.sec-note { color: var(--fg-3); font-size: var(--body-sm); margin: calc(-1 * var(--sp-2)) 0 var(--sp-4); }
.sec-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-4); }
.sec-row .sec-title { margin: 0; }

/* ─── Hero panel (ink, dots, ghosted Q) ─── */
.page-head { position: relative; overflow: hidden; background: var(--ink); color: var(--white); border-radius: var(--radius-card);
  padding: 34px 36px 30px; margin-bottom: var(--sp-5); text-align: var(--align-start); }
.page-head canvas[data-dots] { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero-q { position: absolute; right: -4%; top: 50%; transform: translateY(-50%); width: min(30vw, 300px); opacity: .14; pointer-events: none; }
.hero-q img { width: 100%; display: block; }
.hero-inner { position: relative; z-index: 2; }
.hero-tag { font-family: var(--font-mono); font-weight: 500; font-size: var(--tag-size); letter-spacing: .12em; text-transform: uppercase; color: var(--rose-pink); margin-bottom: var(--sp-3); }
.app-title { font-family: var(--font-display); font-weight: 700; font-size: var(--title-size); letter-spacing: -.03em; line-height: 1; color: var(--white); margin: 0 0 var(--sp-3); }
.app-title em { font-style: normal; color: var(--rose-pink); }
.lead { font-size: var(--body); color: var(--white-92); margin: 0; max-width: 62ch; }

/* ─── Controls ─── */
.seg { display: inline-flex; flex-wrap: nowrap; gap: 2px; padding: 3px; background: var(--bg-2); border: 1px solid var(--border-1); border-radius: var(--radius-pill); }
.seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--radius-pill);
  font-family: var(--font-sans); font-weight: 700; font-size: 13px; color: var(--fg-3); cursor: pointer; transition: background-color .2s, color .2s; }
.seg button:hover { color: var(--quantica-pink); }
.seg button.active { background: var(--quantica-pink); color: var(--white); box-shadow: var(--shadow-pink-soft); }
.seg button:focus-visible, .pill:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-5); }
.toolbar .label { font-family: var(--font-mono); font-size: var(--tag-size); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }

.pill { font-family: var(--font-sans); font-weight: 700; font-size: 14px; text-decoration: none; padding: 10px 20px; border-radius: var(--radius-pill);
  display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid transparent; cursor: pointer; line-height: 1.2;
  transition: transform .2s, background-color .2s, color .2s, border-color .2s; }
.pill:hover { transform: translateY(-1px); }
.pill:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.pill-solid { background: var(--quantica-pink); color: var(--white); box-shadow: var(--shadow-pink-soft); }
.pill-solid:hover { background: var(--deep-berry); }
.pill-ghost { background: var(--bg-1); color: var(--fg-1); border-color: var(--border-2); }
.pill-ghost:hover { border-color: var(--quantica-pink); color: var(--quantica-pink); background: var(--magenta-tint); }
.pill .icon { width: 16px; height: 16px; }

.field { display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; margin-bottom: var(--sp-3); }
.field label { font-family: var(--font-mono); font-weight: 500; font-size: var(--label-size); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.field input, .field select { font-family: var(--font-sans); font-size: var(--body); color: var(--fg-1); background: var(--bg-1);
  border: 1px solid var(--border-2); border-radius: var(--radius-md); padding: 9px 12px; width: 100%; transition: border-color .2s; }
.field input:hover, .field select:hover { border-color: var(--fg-3); }
.field input:focus-visible, .field select:focus-visible { border-color: var(--quantica-pink); }
.field select { cursor: pointer; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.hint { font-size: var(--small-size); color: var(--fg-3); margin: 0; line-height: var(--line-height-tight); }
.check { display: flex; gap: 8px; align-items: center; font-size: var(--body-sm); color: var(--fg-1); margin-bottom: var(--sp-3); cursor: pointer; }
.check input { accent-color: var(--quantica-pink); width: 16px; height: 16px; }

/* ─── Cards (bento cells) ─── */
.card { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 22px 24px;
  transition: border-color .25s, background-color .25s; }
.card:hover { border-color: var(--pink-tint-45); }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: var(--sp-4); }
.card-head h3 { font-family: var(--font-mono); font-weight: 500; font-size: var(--tag-size); letter-spacing: .12em; text-transform: uppercase; margin: 0; color: var(--quantica-pink); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-4 > * { min-width: 0; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }

/* ─── Results ─── */
.chip { font-family: var(--font-mono); font-weight: 500; font-size: var(--tag-size); text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: var(--radius-pill); white-space: nowrap; border: 1px solid transparent; }
.chip-win { background: var(--quantica-pink); color: var(--white); }
.chip-warn { background: var(--ink); color: var(--white); }
.chip-mini { background: var(--bg-2); color: var(--fg-3); border-color: var(--border-1); }
.chip-standard { background: var(--mist); color: var(--violet-primary); }
.chip-frontier { background: var(--ink); color: var(--white); }
.option { display: flex; flex-direction: column; }
.option.winner { border: 1.5px solid var(--quantica-pink); background: var(--pink-tint-05); box-shadow: var(--shadow-pink-soft); }
.option .card-head .chip-slot { margin-left: auto; }
.opt-total { display: flex; align-items: baseline; gap: 6px; }
.opt-total .big { min-width: 0; overflow-wrap: anywhere; font-family: var(--font-display); font-weight: 700; font-size: var(--total-size); letter-spacing: -.03em; color: var(--fg-1); line-height: 1.05; }
.opt-total .per { font-family: var(--font-mono); font-size: var(--tiny-size); color: var(--fg-3); }
.opt-stack { font-family: var(--font-mono); font-size: var(--tiny-size); letter-spacing: .02em; color: var(--fg-3); margin: 6px 0 0; }
#app[data-state="invalid"] .opt-stack { display: none; }
.opt-lines { margin: var(--sp-3) 0 var(--sp-4); background: var(--bg-2); border-radius: var(--radius-md); padding: 10px 14px; }
.line { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 6px 0; font-size: var(--body-sm); color: var(--fg-3); }
.line b { font-family: var(--font-mono); font-weight: 500; color: var(--fg-1); text-align: var(--align-end); white-space: nowrap; }
.line-total { border-top: 1px solid var(--border-2); margin-top: 2px; padding-top: 8px; color: var(--fg-1); font-weight: 700; }
.line-total b { font-weight: 700; }
.line-muted { font-size: var(--small-size); }
.line-muted b { color: var(--fg-3); }
.line-total + .line-muted { border-top: 1px dashed var(--border-2); margin-top: 6px; padding-top: 8px; }
.warn-line { margin: 8px 0 2px; }
.opt-settings { min-width: 0; }
.cost-breakdown { margin-top: var(--sp-4); }
.cost-breakdown > summary { cursor: pointer; font-family: var(--font-mono); font-size: var(--tiny-size); letter-spacing: .04em; color: var(--fg-3); padding: var(--sp-2) 0; }
.cost-breakdown > summary:hover { color: var(--quantica-pink); }
.results-context { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-4) var(--sp-6); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-5); background: var(--bg-2); border: 1px solid var(--border-1); border-radius: var(--radius-md); }
.results-context .hint { flex: 1 1 200px; }
.results-context .stat b { font-size: var(--body-lg); }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat span { font-family: var(--font-mono); font-size: var(--label-size); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.stat b { font-family: var(--font-display); font-weight: 700; font-size: var(--stat-size); letter-spacing: -.01em; color: var(--fg-1); }

.bars { display: flex; flex-direction: column; gap: var(--sp-3); margin: var(--sp-3) 0 var(--sp-5); }
.bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; align-items: center; gap: 10px; font-size: var(--body-sm); }
.bar-label { color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 12px; background: var(--bg-2); border-radius: var(--radius-sm); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; transition: width .25s ease-out; }
.bar-value { font-family: var(--font-mono); font-weight: 500; color: var(--fg-1); white-space: nowrap; }
.answers { list-style: none; margin: 0; padding: 0; }
.answers li { display: flex; justify-content: space-between; gap: var(--sp-4); padding: 9px 0; border-top: 1px dashed var(--border-1); font-size: var(--body-sm); color: var(--fg-3); }
.answers li b { font-family: var(--font-display); font-weight: 700; color: var(--fg-1); text-align: var(--align-end); }
.answers li.hint { display: block; border-top: none; padding-top: var(--sp-2); font-size: var(--small-size); line-height: var(--line-height-tight); color: var(--fg-3); }

/* ─── Charts ─── */
.chart-card { padding: 20px 20px 14px; }
.chart-title { font-family: var(--font-display); font-weight: 700; font-size: var(--h4); letter-spacing: -.015em; margin: 0 0 4px; color: var(--fg-1); }
.chart-sub { font-size: var(--small-size); color: var(--fg-3); margin: 0 0 var(--sp-3); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 6px; font-size: var(--small-size); color: var(--fg-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { display: block; }
.chart-wrap { position: relative; width: 100%; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-md);
  box-shadow: var(--shadow-card); padding: 8px 10px; font-size: var(--small-size); color: var(--fg-3); min-width: 170px; z-index: 5; transition: opacity .1s; }
.tip .tip-head { font-family: var(--font-mono); font-size: var(--label-size); color: var(--fg-3); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
.tip .row b { color: var(--fg-1); font-weight: 600; font-family: var(--font-mono); margin-left: auto; padding-left: 10px; }
details.data-table { margin-top: 6px; font-size: var(--small-size); color: var(--fg-3); }
details.data-table summary { cursor: pointer; color: var(--fg-3); font-family: var(--font-mono); font-size: var(--label-size); letter-spacing: .08em; text-transform: uppercase; }
details.data-table summary:hover { color: var(--quantica-pink); }

/* ─── Tables ─── */
.table-wrap { overflow-x: auto; border: 1px solid var(--border-1); border-radius: var(--radius-lg); background: var(--bg-1); }
table { width: 100%; border-collapse: collapse; font-size: var(--body-sm); }
th { font-family: var(--font-mono); font-weight: 500; font-size: var(--label-size); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3);
  text-align: var(--align-start); padding: 12px 14px; border-bottom: 1px solid var(--border-1); background: var(--bg-2); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border-1); color: var(--fg-3); white-space: nowrap; }
td.num, th.num { text-align: var(--align-end); font-family: var(--font-mono); }
td.num { color: var(--fg-1); }
tbody tr { cursor: pointer; transition: background-color .12s; }
tbody tr:hover { background: var(--bg-2); }
tbody tr.selected { background: var(--magenta-tint); }
tbody tr.selected td { color: var(--fg-1); }
tbody tr.selected td.name { color: var(--quantica-pink); }
tbody tr:last-child td { border-bottom: none; }
td.name { color: var(--fg-1); font-weight: 700; }
.mini-table td, .mini-table th { padding: 6px 10px; }

.drop { border: 1.5px dashed var(--border-2); border-radius: var(--radius-md); padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); color: var(--fg-3); font-size: var(--body-sm); transition: background-color .15s, border-color .15s; }
.drop.over { background: var(--magenta-tint); border-color: var(--quantica-pink); }
.drop .src { font-family: var(--font-mono); font-size: var(--tiny-size); color: var(--fg-1); }
footer.shortcuts { font-family: var(--font-mono); font-size: var(--tag-size); letter-spacing: .04em; color: var(--fg-3); text-align: var(--align-center); margin-top: var(--sp-8); padding-top: var(--sp-5); border-top: 1px solid var(--border-1); }

/* ─── Assumptions dialog ─── */
dialog.assump { border: none; border-radius: var(--radius-card); padding: 0; width: min(980px, calc(100% - 32px)); max-height: calc(100vh - 48px);
  background: var(--bg-1); color: var(--fg-1); box-shadow: var(--shadow-lg); }
dialog.assump::backdrop { background: var(--dialog-backdrop); }
dialog.assump[open] { animation: fadeIn .18s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.assump-head { position: sticky; top: 0; z-index: 2; background: var(--bg-1); border-bottom: 1px solid var(--border-1);
  display: flex; align-items: center; gap: var(--sp-3); padding: 18px 26px; }
.assump-head h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--h3); margin: 0; flex: 1; letter-spacing: -.02em; }
.assump-body { padding: 8px 26px 26px; }
.assump-body > p { color: var(--fg-3); font-size: var(--body-sm); margin: 12px 0 4px; }
.assump-sec h3 { font-family: var(--font-mono); font-weight: 500; font-size: var(--tag-size); letter-spacing: .12em; text-transform: uppercase; color: var(--quantica-pink); margin: 26px 0 10px; }
.assump-table td { white-space: normal; vertical-align: top; }
.assump-table td.name { width: 22%; }
.assump-table td.val { width: 26%; font-family: var(--font-mono); font-size: var(--small-size); color: var(--fg-1); }
.assump-table td.note { color: var(--fg-3); line-height: var(--line-height-note); }
.assump-table tbody tr { cursor: default; }
.assump-table a { color: var(--quantica-pink); font-weight: 700; text-decoration: none; white-space: nowrap; }
.assump-table a:hover { color: var(--deep-berry); text-decoration: underline; }
.csv-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.csv-row .drop { flex: 1 1 320px; }

/* ─── Validation ─── */
#validationStatus, #csvError { color: var(--deep-berry); background: var(--magenta-tint); border: 1px solid var(--quantica-pink); border-radius: var(--radius-md);
  padding: var(--sp-3) var(--sp-4); margin: 0 0 var(--sp-4); font-size: var(--body-sm); line-height: var(--line-height-tight); }
#app[data-state="invalid"] .opt-total,
#app[data-state="invalid"] .opt-lines,
#app[data-state="invalid"] #modelNote,
#app[data-state="invalid"] #bars,
#app[data-state="invalid"] #answers,
#app[data-state="invalid"] #chartTime,
#app[data-state="invalid"] #legendTime,
#app[data-state="invalid"] #tableTime,
#app[data-state="invalid"] .cost-breakdown { display: none; }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--quantica-pink); box-shadow: var(--focus-ring); }
progress#fileProgress { accent-color: var(--quantica-pink); }

/* ─── Settings sidebar ─── */
.fields-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--sp-3); }
.workload-foot { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--sp-6); margin-top: var(--sp-2); padding-top: var(--sp-4); border-top: 1px dashed var(--border-1); }
.seg-inline { margin: 0; }
details.panel { background: var(--bg-1); border: 1px solid var(--border-1); border-radius: var(--radius-card); box-shadow: var(--shadow-card); margin-bottom: var(--sp-4); }
details.panel > summary { cursor: pointer; list-style: none; padding: 16px 24px; font-family: var(--font-display); font-weight: 700; font-size: var(--h4); letter-spacing: -.01em; color: var(--fg-1); display: flex; align-items: center; gap: 10px; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::before { content: '+'; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--magenta-tint); color: var(--quantica-pink); font-family: var(--font-mono); font-size: var(--disclosure-size); flex: none; }
details.panel[open] > summary::before { content: '–'; }
details.panel > :not(summary) { margin-left: 24px; margin-right: 24px; }
details.panel[open] { padding-bottom: 20px; }
.adv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-6); }
.adv-grid h4 { font-family: var(--font-mono); font-weight: 500; font-size: var(--tag-size); letter-spacing: .12em; text-transform: uppercase; color: var(--quantica-pink); margin: 4px 0 var(--sp-3); }

#settingsPanel { min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-right: 1px solid var(--border-1); background: var(--bg-1); scrollbar-gutter: stable; }
.settings-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-4) var(--sp-5); background: var(--nav-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-1); }
.settings-head h2 { margin: 0; font-family: var(--font-mono); font-weight: 500; font-size: var(--tag-size); letter-spacing: .12em; text-transform: uppercase; color: var(--quantica-pink); }
.settings-body { padding: var(--sp-5) var(--sp-4) var(--sp-8); }
.settings-body section { margin-bottom: var(--sp-5); }
.settings-body .sec-title { font-size: var(--body); }
.settings-body .sec-row { display: block; }
.settings-body #presets { display: flex; flex-wrap: wrap; border-radius: var(--radius-md); margin-top: var(--sp-3); margin-bottom: var(--sp-3); }
.settings-body #workloadDetails { border-top: 0; }
.settings-body #workloadDetails > summary { padding-top: var(--sp-2); font-size: var(--body-sm); }
.settings-body #presets button { flex: 1 1 100%; text-align: var(--align-start); padding: var(--sp-2) var(--sp-3); }
.settings-body .card { padding: 0; border: 0; border-radius: 0; box-shadow: none; }
.settings-body .fields-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2) var(--sp-3); }
.settings-body .field { min-width: 0; margin-bottom: var(--sp-2); }
.settings-body .field input, .settings-body .field select { font-size: var(--body-sm); padding: var(--sp-2) 10px; }
.settings-body .field label { letter-spacing: .03em; }
.settings-body .workload-foot { padding-top: var(--sp-3); }
.settings-body .seg button { padding: 6px 10px; }
.settings-body .adv-grid { grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); }
.settings-body .field-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.settings-body .hint, .settings-body .src { overflow-wrap: anywhere; }
details.settings-section { border: 0; border-top: 1px solid var(--border-1); border-radius: 0; box-shadow: none; margin-bottom: 0; }
details.settings-section > summary { padding: var(--sp-4) 0; font-size: var(--body); }
details.settings-section > :not(summary) { margin-left: 0; margin-right: 0; }
details.settings-section[open] { padding-bottom: var(--sp-4); }
#scenarioPanel .toolbar { gap: var(--sp-2); margin: 0; }
#scenarioPanel .pill { flex: 1 1 42%; font-size: var(--small-size); padding: 9px 10px; justify-content: center; }
#scenarioStatus { flex-basis: 100%; }

/* ─── Results workspace ─── */
#resultsPanel { min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-6) clamp(20px, 2.5vw, 40px) var(--sp-8); scrollbar-gutter: stable; background: var(--bg-2); }
#resultsPanel .sec-title { font-size: var(--h4); margin-bottom: var(--sp-3); }
#resultsPanel > section { margin-bottom: var(--sp-5); }
#options { gap: var(--sp-4); }
#options .card { padding: var(--sp-4) var(--sp-5); }
#options .card-head { flex-wrap: wrap; align-items: flex-start; gap: var(--sp-2); margin-bottom: var(--sp-3); }
#options .card-head .dot { margin-top: 3px; }
#options .card-head h3 { flex: 1 1 0; min-width: 0; line-height: 1.4; }
#options .opt-total { flex-wrap: wrap; }
#options .opt-lines { margin-bottom: 0; padding: var(--sp-2) var(--sp-3); }
#options .line { padding: 4px 0; gap: var(--sp-2); }
#options .line b { white-space: normal; overflow-wrap: anywhere; }
#resultsPanel .two-col { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
#settingsToggle, #settingsClose, #settingsBackdrop { display: none; }
summary:focus-visible, #resultsPanel:focus-visible { outline: 2px solid var(--quantica-pink); outline-offset: 2px; }

@media (max-width: 1400px) { #options { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 769px) and (max-width: 1200px) {
  :root { --sidebar-width: 290px; --total-size: 28px; }
  #resultsPanel .two-col { grid-template-columns: minmax(0, 1fr); }
  #options { gap: var(--sp-3); }
  #options .card { padding: var(--sp-3) var(--sp-4); }
  #options .card-head .chip-slot { margin-left: 0; }
}
@media (max-width: 1000px) { .fields-grid { grid-template-columns: repeat(3, 1fr); } .adv-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) {
  :root { --title-size: 1.7rem; --total-size: 30px; }
  main { display: block; padding: 0; }
  .nav-inner { padding: 0 var(--sp-3); gap: var(--sp-2); }
  .nav-tag { display: none; }
  .nav-logo img { height: 24px; }
  .nav .pill { font-size: var(--tiny-size); padding: 8px 9px; white-space: nowrap; }
  .nav .seg button { font-size: var(--tiny-size); padding: 6px 8px; }
  #settingsToggle, #settingsClose { display: inline-flex; }
  #settingsPanel { display: none; position: fixed; inset: 0 auto 0 0; z-index: 80; width: min(360px, calc(100% - 32px)); box-shadow: var(--shadow-lg); }
  #app[data-settings="open"] #settingsPanel { display: block; animation: fadeIn .18s ease-out; }
  #app[data-settings="open"] #settingsBackdrop:not([hidden]) { display: block; position: fixed; inset: 0; z-index: 70; width: 100%; height: 100%; padding: 0; border: 0; background: var(--dialog-backdrop); }
  #resultsPanel { height: 100%; padding: var(--sp-4) var(--sp-4) var(--sp-8); }
  #resultsPanel .two-col, #options, .fields-grid, .adv-grid { grid-template-columns: minmax(0, 1fr); }
  .page-head { padding: 26px 22px 22px; }
  .hero-q { width: 60vw; right: -20%; opacity: .1; }
  .bar-row { grid-template-columns: 1fr auto; }
  .bar-track { grid-column: 1 / -1; grid-row: 2; }
  .results-context { gap: var(--sp-3); }
  .results-context .hint { flex-basis: 100%; }
  .assump-table td.name, .assump-table td.val { width: auto; }
  .assump-head, .assump-body { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  #app[data-settings="open"] #settingsPanel, dialog.assump[open] { animation: none; }
  * { transition-duration: 0.01ms !important; }
}
</style>

    breakEvenSmall: breakEvenUsers(apiAtUsers, smallAtUsers, 20000),

}

function regressionFixtureModels() {
  return [
    { name: 'Regression Terra', id: 'regression-terra', family: 'openai', pin: 2, pout: 12, ctx: 1050000, maxOutput: 128000, alwaysThinks: false, tier: { above: 272000, pin: 4, pout: 18 }, offPeak: null },
    { name: 'Regression Fable', id: 'regression-fable', family: 'claudeNew', pin: 10, pout: 50, ctx: 1000000, maxOutput: 128000, alwaysThinks: true, tier: null, offPeak: null },
  ];
}
function runRegressionChecks(models = []) {
  const sourceModels = Array.isArray(models) && models.length ? models : regressionFixtureModels();
  const terra = sourceModels.find((item) => item.id === 'gpt-5.6-terra' || item.id === 'regression-terra') || sourceModels[0];
  const fable = sourceModels.find((item) => item.id === 'claude-fable-5-1' || item.id === 'regression-fable') || sourceModels[0];
  const s = { ...DEFAULTS, model: terra.name, cloudOps: 0, ownReplace: DEFAULTS.ownAmort, smallReplace: DEFAULTS.smallAmort };
  const checks = [];
  const add = (name, pass, detail) => checks.push({ name, pass: Boolean(pass), detail: String(detail) });
  try {
    const api = apiCost(terra, s);
    const cloud = cloudCost(s);
    const own = ownCost(s);
    add('baseline API', Math.abs(api.monthly - 839.25) < 1e-6, api.monthly.toFixed(6));
    add('baseline cloud', Math.abs(cloud.monthly - 10000) < 1e-6, cloud.monthly.toFixed(6));
    add('baseline own', Math.abs(own.monthly - 7601.084444444445) < 1e-6, own.monthly.toFixed(6));
    const small = smallCost(s);
    add('baseline small (Dell GB10)', Math.abs(small.monthly - SMALL_BASELINE) < 1e-6 && small.capex === 35000, small.monthly.toFixed(6));
    const totals = { api: totalCost('api', s, s.users, terra), cloud: totalCost('cloud', s), small: totalCost('small', s), own: totalCost('own', s) };
    const softOk = Math.abs(totals.api.monthly - (api.monthly + s.apiOps + s.softApi)) < 1e-9 && Math.abs(totals.cloud.monthly - (cloud.monthly + s.softCloud)) < 1e-9
      && Math.abs(totals.own.monthly - (own.monthly + s.softLicense / s.softAmort + s.softSupport / 12)) < 1e-9
      && cumulativeCost('small', totals.small, 0) === small.capex + s.softLicense && cumulativeCost('api', totals.api, 12) === totals.api.monthly * 12;
    add('Zagłoba RAG software layer', softOk, `${totals.api.monthly.toFixed(2)} / ${totals.own.monthly.toFixed(2)}`);
    const exact = apiCost(terra, { ...s, chunks: 1, chunkTok: 272000, promptTok: 0, outTok: 0 });
    const above = apiCost(terra, { ...s, chunks: 1, chunkTok: 272001, promptTok: 0, outTok: 0 });
    add('long-context threshold', exact.tiered === false && above.tiered === true, `${exact.pin}/${above.pin}`);
    add('Fable reasoning', fable.alwaysThinks === true && modelThinks(fable, { ...s, thinking: false }), String(fable.alwaysThinks));
    const workCloud = cloudCost({ ...s, cloudMode: 'work', cloudOps: 700 });
    add('fixed cloud support', Math.abs(workCloud.monthly - (workCloud.gpuMonthly + 700)) < 1e-9, workCloud.monthly.toFixed(6));
    const replaced = ownCost({ ...s, ownReplace: 6 });
    add('replacement schedule', cumulativeCost('own', replaced, 0) === replaced.capex && cumulativeCost('own', replaced, 7) > cumulativeCost('own', replaced, 6), String(replaced.replacementMonths));
    add('replacement payback', paybackMonth(replaced, 7000, 120) === null, String(paybackMonth(replaced, 7000, 120)));
    const zeroInvalid = Object.entries(FIELD_SCHEMA).filter(([, rule]) => rule.min > 0).every(([id]) => validateField(id, 0).error === 'range');
    const maxValid = Object.entries(FIELD_SCHEMA).every(([id, rule]) => validateField(id, rule.max).valid);
    add('field bounds', zeroInvalid && maxValid && validateField('horizon', FIELD_SCHEMA.horizon.max + 1).error === 'range', JSON.stringify(validateField('horizon', FIELD_SCHEMA.horizon.max + 1)));
    const contextModel = sourceModels.find((item) => item.ctx) || terra;
    const contextOver = apiCost(contextModel, { ...s, model: contextModel.name, chunks: 1, chunkTok: contextModel.ctx + 1, promptTok: 0, outTok: 0 });
    const outputOver = apiCost(contextModel, { ...s, model: contextModel.name, chunks: 1, chunkTok: 0, promptTok: 0, outTok: contextModel.maxOutput + 1 });
    add('context and output limits', contextOver.ctxOver && !contextOver.eligible && outputOver.outputOver && !outputOver.eligible, `${contextOver.reason}/${outputOver.reason}`);
    const malformed = `${CSV_REQUIRED_COLUMNS.join(',')}\nBad,-1,1,1,mini,,bad,openai,1,false,,,,,,2026-01-01,source`;
    let rejected = false;
    try { modelsFromCsv(malformed); } catch (_) { rejected = true; }
    add('strict CSV rejection', rejected, String(rejected));
  } catch (error) {
    add('regression execution', false, error.message);
  }
  return checks;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function lineChart(wrap, { xs, series, xFmt, xHead, height = 280 }) {
  wrap.replaceChildren();
  const W = Math.max(300, wrap.clientWidth || 500), H = height;
  const pad = { l: 58, r: 96, t: 12, b: 30 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const yMax = niceMax(Math.max(...series.flatMap((s) => s.ys)) * 1.05);
  const xMin = xs[0], xMax = xs[xs.length - 1];
  const X = (v) => pad.l + (v - xMin) / (xMax - xMin || 1) * iw;
  const Y = (v) => pad.t + ih - v / yMax * ih;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': series.map((s) => s.label).join(', ') });
  // grid + y ticks
  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4, y = Y(v);
    svg.append(svgEl('line', { x1: pad.l, x2: pad.l + iw, y1: y, y2: y, stroke: COLORS.line, 'stroke-width': 1 }));
    const tx = svgEl('text', { x: pad.l - 8, y: y + 4, 'text-anchor': CHART_TYPE.tickAlign, 'font-size': CHART_TYPE.tickSize, fill: COLORS.ink3, 'font-family': CHART_TYPE.mono });
    tx.textContent = moneyShort(v); svg.append(tx);
  }
  // x ticks
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const v = xMin + (xMax - xMin) * i / ticks;
    const tx = svgEl('text', { x: X(v), y: H - 8, 'text-anchor': CHART_TYPE.xAlign, 'font-size': CHART_TYPE.tickSize, fill: COLORS.ink3, 'font-family': CHART_TYPE.mono });
    tx.textContent = xFmt(Math.round(v)); svg.append(tx);
  }
  // lines
  series.forEach((s) => {
    const d = xs.map((x, i) => (s.step && i ? `H${X(x).toFixed(1)}V${Y(s.ys[i]).toFixed(1)}` : `${i ? 'L' : 'M'}${X(x).toFixed(1)},${Y(s.ys[i]).toFixed(1)}`)).join('');
    svg.append(svgEl('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-dasharray': s.dash || '', 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'data-series': s.key }));
  });
  // direct labels at right end with collision avoidance
  const ends = series.map((s) => ({ s, y: Y(s.ys[s.ys.length - 1]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
  ends.forEach(({ s, y }) => {
    const tx = svgEl('text', { x: pad.l + iw + 8, y: y + 4, 'font-size': CHART_TYPE.labelSize, fill: COLORS.ink, 'font-family': CHART_TYPE.sans });
    tx.textContent = s.short; svg.append(tx);
  });
  // hover layer
  const cross = svgEl('line', { y1: pad.t, y2: pad.t + ih, stroke: COLORS.ink3, 'stroke-width': 1, opacity: 0 });
  const dots = series.map((s) => svgEl('circle', { r: 4.5, fill: s.color, stroke: COLORS.surface, 'stroke-width': 2, opacity: 0 }));
  svg.append(cross, ...dots);
  const hit = svgEl('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent', tabindex: 0 });
  svg.append(hit);
  wrap.append(svg);
  const tip = el('div', { class: 'tip' }); tip.style.opacity = 0; wrap.append(tip);
  let idx = xs.length - 1;
  const show = (i) => {
    idx = Math.max(0, Math.min(xs.length - 1, i));
    const scale = wrap.clientWidth / W;
    const x = X(xs[idx]);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', 1);
    dots.forEach((d, k) => { d.setAttribute('cx', x); d.setAttribute('cy', Y(series[k].ys[idx])); d.setAttribute('opacity', 1); });
    tip.replaceChildren(el('div', { class: 'tip-head' }, xHead + ': ' + xFmt(xs[idx])));
    [...series].sort((a, b) => a.ys[idx] - b.ys[idx]).forEach((s) => {
      const row = el('div', { class: 'row' });
      const key = svgEl('svg', { width: 14, height: 6 }); key.append(svgEl('line', { x1: 0, y1: 3, x2: 14, y2: 3, stroke: s.color, 'stroke-width': 2.5, 'stroke-dasharray': s.dash ? '4 2' : '' }));
      row.append(key, el('span', {}, s.short), el('b', {}, money(s.ys[idx], 0)));
      tip.append(row);
    });
    tip.style.opacity = 1;
    const tw = tip.offsetWidth;
    let left = x * scale + 14; if (left + tw > wrap.clientWidth) left = x * scale - tw - 14;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '10px';
  };
  const hide = () => { tip.style.opacity = 0; cross.setAttribute('opacity', 0); dots.forEach((d) => d.setAttribute('opacity', 0)); };
  hit.addEventListener('pointermove', (e) => {
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) * W / rect.width;
    const v = xMin + (px - pad.l) / iw * (xMax - xMin);
    let best = 0; xs.forEach((x, i) => { if (Math.abs(x - v) < Math.abs(xs[best] - v)) best = i; });
    show(best);
  });
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('focus', () => show(idx));
  hit.addEventListener('blur', hide);
  hit.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
  });
}
function dataTable(box, xs, series, xHead, xFmt) {
  const table = el('table', { class: 'mini-table' });
  const hr = el('tr'); hr.append(el('th', {}, xHead), ...series.map((s) => el('th', { class: 'num' }, s.short)));
  const tb = el('tbody');
  const step = Math.max(1, Math.ceil(xs.length / 12));
  xs.forEach((x, i) => {
    if (i % step && i !== xs.length - 1) return;
    const tr = el('tr'); tr.append(el('td', {}, xFmt(x)), ...series.map((s) => el('td', { class: 'num' }, money(s.ys[i], 0)))); tb.append(tr);
  });
  const th = el('thead'); th.append(hr); table.append(th, tb); box.replaceChildren(table);
}

      return !n.disabled && !n.hidden && n.getClientRects().length > 0 && (!closed || (n.tagName === 'SUMMARY' && n.parentElement === closed));
    });
  const first = items[0], last = items[items.length - 1];
  if (!first) { e.preventDefault(); return; }
  if (e.shiftKey && (document.activeElement === first || !settingsPanel.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (document.activeElement === last || !settingsPanel.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
}

// ─── Scenario helpers ───
const LS_SCENARIO = 'quantica-aicalc-scenario-v2';
const MAX_SCENARIO_BYTES = 1024 * 1024;
function serializeScenario(s) {
  const values = Object.fromEntries([...Object.keys(DEFAULTS), 'lang'].map((key) => [key, s[key]]));
  return { version: 1, values, csvText: s.csvText, csvSource: s.csvSource || null };
}
function parseScenario(text) {
  if (typeof text !== 'string' || utf8ByteLength(text) > MAX_SCENARIO_BYTES) throw new Error('size');
  const parsed = JSON.parse(text);
  if (!parsed || parsed.version !== 1 || !parsed.values || typeof parsed.values !== 'object' || Array.isArray(parsed.values)) throw new Error('version / values');
  const values = Object.fromEntries([...Object.keys(DEFAULTS), 'lang'].map((key) => [key, parsed.values[key]]));
  if (NUM_FIELDS.some((key) => typeof values[key] !== 'number')) throw new Error('numeric settings');
  if (Object.keys(validateState(values)).length) throw new Error('invalid settings');
  if (!['pl', 'en'].includes(values.lang) || !['pl', 'en'].includes(values.docLang) || !['work', '247'].includes(values.cloudMode)) throw new Error('language / mode');
  if (typeof values.thinking !== 'boolean' || typeof values.offPeak !== 'boolean') throw new Error('boolean');
  if (TEXT_FIELDS.some((key) => typeof values[key] !== 'string' || values[key].length > 200)) throw new Error('GPU label');
  if (typeof parsed.csvText !== 'string') throw new Error('CSV');
  const models = modelsFromCsv(parsed.csvText);
  if (!models.some((m) => m.name === values.model)) throw new Error('model');
  if (parsed.csvSource !== null && (typeof parsed.csvSource !== 'string' || parsed.csvSource.length > 255)) throw new Error('source');
  computeResults(values, models);
  return { values, models, csvText: parsed.csvText, csvSource: parsed.csvSource };
}

function markDirty() {
  App.dirty = true;
  appEl.dataset.dirty = 'true';
  $('scenarioStatus').textContent = t('scenarioUnsaved');
}
function renderValidation() {
  const errors = new Set([...App.invalidFields, ...Object.keys(validateState(state))]);
  NUM_FIELDS.forEach((id) => {
    const n = $(id), rule = FIELD_SCHEMA[id];
    const invalid = errors.has(id);
    const msg = t(rule.integer ? 'invalidInteger' : 'invalidNumber', { min: rule.min, max: rule.max });
    n.setAttribute('aria-invalid', String(invalid));
    n.setCustomValidity(invalid ? msg : '');
    let hint = $(id + 'Error');
    if (!hint) { hint = el('span', { id: id + 'Error', class: 'hint' }); n.after(hint); n.setAttribute('aria-describedby', hint.id); }
    hint.hidden = !invalid; hint.textContent = invalid ? msg : '';
  });
  const invalid = errors.size > 0;
  const status = $('validationStatus'); status.hidden = !invalid;
  status.textContent = invalid ? t('invalidFields', { fields: [...errors].map((id) => document.querySelector(`label[for="${id}"]`)?.textContent || id).join(', ') }) : '';
  $('scenarioSave').disabled = invalid || App.fileBusy;
  $('scenarioExport').disabled = invalid || App.fileBusy;
  if (invalid) {
    App.results = null;
    for (const key of Object.keys(appEl.dataset)) if (key !== 'settings') delete appEl.dataset[key];
    appEl.dataset.state = 'invalid'; appEl.dataset.invalidFields = [...errors].join(',');
    document.querySelectorAll('.option').forEach((n) => { n.dataset.winner = 'false'; n.dataset.monthly = ''; n.classList.remove('winner'); n.querySelector('.chip-slot').replaceChildren(); });
    $('modelsPanel').hidden = true;
  } else { appEl.dataset.invalidFields = ''; $('modelsPanel').hidden = false; }
  return !invalid;
}
function applyScenario(loaded) {
  Object.assign(state, loaded.values, { lang: state.lang, models: loaded.models, csvText: loaded.csvText, csvSource: loaded.csvSource });
  App.invalidFields.clear();
  applyI18n(); renderModelSelect(); syncInputs(true); render(); markDirty();
  $('scenarioStatus').textContent = t('scenarioLoaded');
}
function saveScenario() {
  if (App.fileBusy || !renderValidation()) return false;
  try {
    const text = JSON.stringify(serializeScenario(state));
    parseScenario(text);
    localStorage.setItem(LS_SCENARIO, text);
    App.dirty = false; appEl.dataset.dirty = 'false';
    $('scenarioStatus').textContent = t('scenarioSaved');
    return true;
  } catch (_) { $('scenarioStatus').textContent = t('storageError'); return false; }
}
function downloadText(text, filename, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const link = el('a', { href: url, download: filename }); document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function readLocalFile(file, accept, errorNode, onError) {
  if (!file || App.fileBusy) return;
  const revision = ++App.fileRevision;
  if (file.size > MAX_SCENARIO_BYTES) {
    errorNode.hidden = false; errorNode.textContent = t('fileError');
    $('scenarioStatus').textContent = t('fileError'); return;
  }
  App.fileBusy = true; $('fileProgress').hidden = false; $('fileProgress').removeAttribute('value');
  $('scenarioStatus').textContent = t('importBusy');
  document.querySelectorAll('#scenarioSave, #scenarioExport, #scenarioImport, #scenarioReset, #csvBtn, #csvReset').forEach((n) => n.disabled = true);
  try {
    const text = await file.text();
    if (revision !== App.fileRevision) return;
    accept(text, file.name);
  } catch (error) {
    if (revision !== App.fileRevision) return;
    errorNode.hidden = false;
    errorNode.textContent = onError(error);
    if (errorNode !== $('scenarioStatus')) $('scenarioStatus').textContent = t('fileError');
  } finally {
    if (revision === App.fileRevision) {
      App.fileBusy = false; $('fileProgress').hidden = true;
      document.querySelectorAll('#scenarioImport, #scenarioReset, #csvBtn, #csvReset').forEach((n) => n.disabled = false);
      renderValidation();
    }
  }
}
function checkDomContract(doc, result) {
  const checks = [];
  const probe = (name, fn) => { try { const pass = Boolean(fn()); checks.push({ name, pass, detail: pass ? '' : 'contract mismatch' }); } catch (error) { checks.push({ name, pass: false, detail: error.message }); } };
  probe('DOM: ready state', () => doc.querySelector('#app')?.dataset.state === 'ready' && result);
  probe('DOM: settings containment', () => {
    const sidebar = doc.querySelector('#settingsPanel');
    return sidebar && [...NUM_FIELDS, ...TEXT_FIELDS, 'model', 'thinking', 'offPeak', 'presets', 'scenarioSave', 'advancedPanel'].every((id) => sidebar.contains(doc.querySelector('#' + id)));
  });
  probe('DOM: results without settings', () => {
    const results = doc.querySelector('#resultsPanel');
    return results && results.contains(doc.querySelector('#options')) && results.querySelectorAll('input, select').length === 0;
  });
  probe('DOM: settings toggle state', () => {
    const open = doc.querySelector('#app')?.dataset.settings === 'open';
    return doc.querySelector('#settingsToggle')?.getAttribute('aria-expanded') === String(open) && doc.querySelector('#resultsPanel')?.inert === open;
  });
  for (const key of ['api', 'cloud', 'own', 'small']) {
    probe('DOM: ' + key + ' monthly cost', () => {
      const node = doc.querySelector('#opt' + key[0].toUpperCase() + key.slice(1));
      const expected = key === 'api' && !result.api.eligible ? '' : result[key].monthly.toFixed(2);
      return node && node.dataset.monthly === expected && node.dataset.winner === String(result.winner === key);
    });
  }
  probe('DOM: model rows', () => doc.querySelectorAll('#modelTable tbody tr').length === state.models.length);
  probe('DOM: no nonfinite chart coordinates', () => {
    const paths = [...doc.querySelectorAll('#chartTime path[data-series]')];
    return paths.length === (result.api.eligible ? 4 : 3) && paths.every((p) => !/NaN|Infinity/.test(p.getAttribute('d')));
  });
  return checks;
}
function showChecks() {
  let checks;
  try { checks = runRegressionChecks(modelsFromCsv($('csvData').textContent)); }
  catch (error) { checks = [{ name: 'built-in price list', pass: false, detail: error.message }]; }
  checks.push(...checkDomContract(document, App.results));
  const passed = checks.filter((c) => c.pass).length;
  $('checksStatus').textContent = t('checksResult', { passed, total: checks.length });
  $('checksPanel').dataset.passed = String(passed); $('checksPanel').dataset.total = String(checks.length); $('checksPanel').dataset.state = passed === checks.length ? 'pass' : 'fail';
  $('checksResults').replaceChildren(...checks.map((c) => el('li', { 'data-check': c.name, 'data-pass': String(c.pass) }, `${c.pass ? '✓' : '✗'} ${c.name}${c.detail ? ': ' + c.detail : ''}`)));
}

// ─── Listeners ───
settingsToggle.addEventListener('click', () => setSettingsOpen(!App.settingsOpen));
$('settingsClose').addEventListener('click', () => setSettingsOpen(false));
$('settingsBackdrop').addEventListener('click', () => setSettingsOpen(false));
document.addEventListener('keydown', onSettingsKeydown);
mobileSettings.addEventListener('change', () => {
  const inSidebar = settingsPanel.contains(document.activeElement);
  setSettingsOpen(false, false);
  if (mobileSettings.matches && inSidebar) settingsToggle.focus();
});
function onInput(e) {
  const id = e.target.id;
  if (NUM_FIELDS.includes(id)) {
    const checked = validateField(id, e.target.value);
    if (!checked.valid) App.invalidFields.add(id);
    else { App.invalidFields.delete(id); state[id] = checked.value; }
  }
  else if (TEXT_FIELDS.includes(id)) state[id] = e.target.value.slice(0, 200);
  else if (id === 'offPeak' || id === 'thinking') state[id] = e.target.checked;
  else if (id === 'model') state.model = e.target.value;
  else return;
  markDirty(); render();
}
document.addEventListener('input', onInput);

function applyPreset(k) { Object.assign(state, PRESETS[k]); PRESET_FIELDS.forEach((id) => App.invalidFields.delete(id)); syncInputs(true); markDirty(); render(); }
$('presets').addEventListener('click', (e) => { const b = e.target.closest('[data-preset]'); if (b) applyPreset(b.dataset.preset); });
document.addEventListener('click', (e) => {
  const dl = e.target.closest('[data-doclang]'); if (dl) { state.docLang = dl.dataset.doclang; markDirty(); render(); }
  const cm = e.target.closest('[data-cloudmode]'); if (cm) { state.cloudMode = cm.dataset.cloudmode; markDirty(); render(); }
  if (e.target.closest('.js-assump')) openAssumptions();
});

document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
function setLang(l) {
  state.lang = l;
  try { localStorage.setItem(LS_LANG, l); } catch (_) {}
  applyI18n(); renderModelSelect(); markDirty(); render();
}

$('assumpClose').addEventListener('click', () => dialogEl.close());
dialogEl.addEventListener('click', (e) => { if (e.target === dialogEl) dialogEl.close(); });
dialogEl.addEventListener('close', () => { appEl.dataset.assumptionsOpen = 'false'; });

modelTbody.addEventListener('click', (e) => { const tr = e.target.closest('tr[data-model]'); if (tr) selectModel(tr.dataset.model); });
modelTbody.addEventListener('keydown', (e) => {
  const tr = e.target.closest('tr[data-model]'); if (!tr) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectModel(tr.dataset.model); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const sib = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling;
    if (sib) selectModel(sib.dataset.model);
  }
});
function selectModel(name) {
  state.model = name; modelSel.value = name; markDirty(); render();
  const row = modelTbody.querySelector(`tr[data-model="${CSS.escape(name)}"]`); if (row) row.focus();
}

function loadCsvText(text, source) {
  try {
    const models = modelsFromCsv(text);
    const model = models.some((m) => m.name === state.model) ? state.model : models[0].name;
    computeResults({ ...state, model }, models);
    state.models = models; state.csvSource = source; state.csvText = text;
    $('csvError').hidden = true;
    renderModelSelect(); markDirty(); render();
    $('scenarioStatus').textContent = t('csvLoaded');
    return true;
  } catch (error) {
    $('csvError').hidden = false;
    $('csvError').textContent = t('csvLoadError', { error: error.message });
    $('scenarioStatus').textContent = t('fileError');
    return false;
  }
}
$('csvFile').addEventListener('change', (e) => { readLocalFile(e.target.files[0], loadCsvText, $('csvError'), (error) => t('csvLoadError', { error: error.message })); e.target.value = ''; });
$('csvBtn').addEventListener('click', () => $('csvFile').click());
$('csvReset').addEventListener('click', () => loadCsvText($('csvData').textContent, null));
$('csvTemplate').addEventListener('click', () => downloadText($('csvData').textContent, 'aicalc-prices.csv', 'text/csv;charset=utf-8'));
['dragenter', 'dragover'].forEach((ev) => dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.remove('over'); }));
dropEl.addEventListener('drop', (e) => readLocalFile(e.dataTransfer.files[0], loadCsvText, $('csvError'), (error) => t('csvLoadError', { error: error.message })));

$('scenarioSave').addEventListener('click', saveScenario);
$('scenarioExport').addEventListener('click', () => {
  if (!renderValidation()) return;
  try {
    const text = JSON.stringify(serializeScenario(state), null, 2);
    parseScenario(text);
    downloadText(text, 'aicalc-scenario.json', 'application/json');
  } catch (error) { $('scenarioStatus').textContent = t('scenarioError', { error: error.message }); }
});
$('scenarioImport').addEventListener('click', () => $('scenarioFile').click());
$('scenarioFile').addEventListener('change', (e) => {
  readLocalFile(e.target.files[0], (text) => applyScenario(parseScenario(text)), $('scenarioStatus'), (error) => t('scenarioError', { error: error.message }));
  e.target.value = '';
});
$('scenarioReset').addEventListener('click', () => {
  Object.assign(state, DEFAULTS); App.invalidFields.clear();
  renderModelSelect(); syncInputs(true); render();
  if (saveScenario()) $('scenarioStatus').textContent = t('scenarioResetDone');
});
$('runChecks').addEventListener('click', showChecks);

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveScenario(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest?.('input, select, textarea')) return;
  if (dialogEl.open) return;
  const keys = Object.keys(PRESETS);
  if (/^[1-3]$/.test(e.key)) applyPreset(keys[+e.key - 1]);
  const k = e.key.toLowerCase();
  if (k === 'l') setLang(state.lang === 'pl' ? 'en' : 'pl');
  if (k === 'a' || k === 'z') openAssumptions();
});
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 120); });

// ─── Hero dots (qweb idiom; respects prefers-reduced-motion) ───
function initDots(canvas) {
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dots = Array.from({ length: 50 }, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.2,
    vx: (Math.random() - 0.5) * 0.0006, vy: (Math.random() - 0.5) * 0.0006, o: 0.12 + Math.random() * 0.5 }));
  const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
  resize(); window.addEventListener('resize', resize);
  const frame = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    dots.forEach((d) => {
      d.x = (d.x + d.vx + 1) % 1; d.y = (d.y + d.vy + 1) % 1;
      ctx.beginPath(); ctx.arc(d.x * canvas.width, d.y * canvas.height, d.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(210, 7, 87, ' + d.o + ')'; ctx.fill();
    });
    if (!reduced) requestAnimationFrame(frame);
  };
  frame();
}

// ─── Init ───
(function init() {
  const css = getComputedStyle(document.documentElement);
  const token = (name) => css.getPropertyValue(name).trim();
  for (const [key, name] of Object.entries({ api: '--chart-api', cloud: '--chart-cloud', own: '--chart-own', small: '--chart-small', ink: '--fg-1', ink3: '--fg-3', line: '--border-1', surface: '--bg-1' })) COLORS[key] = token(name);
  Object.assign(CHART_TYPE, { mono: token('--font-mono'), sans: token('--font-sans'), tickSize: token('--chart-tick-size'), labelSize: token('--chart-label-size'), tickAlign: token('--chart-tick-align'), xAlign: token('--chart-x-align') });
  for (const [id, rule] of Object.entries(FIELD_SCHEMA)) {
    const input = $(id); input.min = rule.min; input.max = rule.max; input.step = rule.integer ? '1' : 'any';
  }
  TEXT_FIELDS.forEach((id) => $(id).maxLength = 200);
  let preferredLang;
  try { const l = localStorage.getItem(LS_LANG); if (l === 'pl' || l === 'en') preferredLang = l; } catch (_) {}
  state.csvText = $('csvData').textContent;
  state.models = modelsFromCsv(state.csvText);
  let restoreError = false;
  try {
    const saved = localStorage.getItem(LS_SCENARIO);
    if (saved) { const loaded = parseScenario(saved); Object.assign(state, loaded.values, { models: loaded.models, csvText: loaded.csvText, csvSource: loaded.csvSource }); }
  } catch (_) { restoreError = true; }
  if (preferredLang) state.lang = preferredLang;
  applyI18n();
  renderModelSelect();
  syncInputs();
  syncSettingsPanel();
  render();
  if (restoreError) $('scenarioStatus').textContent = t('scenarioError', { error: 'local storage' });
  document.querySelectorAll('canvas[data-dots]').forEach(initDots);
  if (new URLSearchParams(location.search).has('verify')) { $('checksPanel').open = true; showChecks(); }
})();
</script>
